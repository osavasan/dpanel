{{template "header_insession" .}}
<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Auth Log</h2>
        </div>
        <div class="card mb-3">
            <div class="card-body">
                <input type="text" id="customFilter" class="form-control form-control-lg" placeholder="Filter log entries...">
            </div>
        </div>
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table id="authLogTable" class="table table-striped table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Log Entry</th>
                            </tr>
                        </thead>
                        <tbody>
                            {{range .list}}
                            <tr>
                                <td>{{.}}</td>
                            </tr>
                            {{end}}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{{template "footer_insession" .}}
